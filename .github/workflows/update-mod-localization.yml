name: Update mod localization catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * 0' # Monday 03:00 China Standard Time (UTC+8)

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mod-localization-data
  cancel-in-progress: false

jobs:
  update-mod-localization:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline parser and merge tests
        run: python -m unittest discover -s scripts/mod_localization/tests -v
      - name: Crawl within request budget
        id: crawl
        run: python scripts/mod_localization/update_mods.py --max-requests 200
      - name: Validate generated catalog
        id: validate
        if: ${{ !cancelled() && steps.crawl.outcome != 'skipped' }}
        run: python scripts/mod_localization/update_mods.py --check-only
      - name: Create review PR for data and crawl state
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/mod-localization-data
          base: master
          delete-branch: true
          title: 'chore: review MC Encyclopedia mod localization updates'
          commit-message: 'chore: update mod localization catalog'
          body: |
            Generated by a scheduled or manually triggered, request-budgeted crawl.
            Review additions, translated names and changed links before merging.
            See `crawl-state.json` → `lastRun` for request counts, outcomes and the remaining new-ID backlog.
            The client does not download this data at runtime; it is embedded in a later launcher release.
          add-paths: |
            Launcher.Infrastructure/Resources/ResourceLocalization/Data/mods.v1.jsonl
            scripts/mod_localization/crawl-state.json
